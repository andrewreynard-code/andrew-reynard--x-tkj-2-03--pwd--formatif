<!--
Perhitungan lebar kartu jika box-sizing tidak diatur:
320px (width) + 20px (padding kiri) + 20px (padding kanan)
+ 2px (border kiri) + 2px (border kanan) = 364px
-->

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Proyek</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f8fafc;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .card {
            width: 320px;
            padding: 20px;
            border: 2px solid #cbd5e1;
            margin: 30px auto 30px auto;
            background-color: #ffffff;
            border-radius: 10px;
        }

        .card img {
            width: 100%;
            height: 160px;
            display: block;
            object-fit: cover;
            border-radius: 6px;
        }

        .card h3 {
            color: #1e293b;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .card p {
            font-size: 15px;
            color: #475569;
            line-height: 1.5;
            margin-bottom: 14px;
        }

        .card a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: underline;
        }

        footer {
            text-align: center;
            margin-bottom: 30px;
        }

        footer a {
            color: #7c3aed;
            font-size: 15px;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <main>
        <article class="card">
            <img src="/assets/images/download (1).jpg" alt="Sepatu Nike">

            <h3>Proyek Membuat Logo</h3>

            <p>
                proyek latihan membuat halaman toko sederhana.
            </p>

            <a href="/components/card-badge.html">Lihat Proyek</a>
        </article>
    </main>

    <footer>
        <a href="/index.html">Kembali ke Beranda</a>
    </footer>

</body>
</html>
